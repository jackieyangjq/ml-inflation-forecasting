[project]
name = "ml-inflation-forecasting"
version = "0.1.0"
description = "Forecasting US CPI inflation with machine learning on the FRED-MD panel: a replication and extension of Medeiros, Vasconcelos, Veiga and Zilberman (2021)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2",
    "shap>=0.45",
    "arch>=7",
    "matplotlib",
    "joblib",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
inflation-ml = "inflation_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inflation_ml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
